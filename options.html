<!DOCTYPE html>
<html>

<head>
  <title>YouTube Focus Settings</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 500px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
    }

    button {
      padding: 8px 16px;
      background: #000;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    .status {
      color: green;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>
  <h2>AI Configuration</h2>
  <label>MiniMax API Key:</label>
  <input type="password" id="apiKey" placeholder="eyJ...">

  <button id="save">Save Settings</button>
  <div id="status" class="status">Saved!</div>
  <script src="options.js"></script>
</body>

</html>
